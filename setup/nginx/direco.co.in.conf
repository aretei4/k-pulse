server {
    listen 80;
    server_name direco.co.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name direco.co.in;

    ssl_certificate /etc/ssl/direco/fullchain.pem;
    ssl_certificate_key /etc/ssl/direco/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # React build root
    root /var/www/distr/build/dist;
    index index.html;

    location = /sw.js {
        add_header Cache-Control "no-store";
        return 404;
    }

    location = /index.html {
        try_files /index.html =404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Proxy to Spring Boot running on host
    location /api/ {
        proxy_pass http://host.docker.internal:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /pur/ {
        proxy_pass http://host.docker.internal:8060/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Live delivery-agent location tracking (WebSocket).
    # Same Spring Boot app as /api/ above — keep this port identical to that one.
    location /api/ws/ {
        proxy_pass http://host.docker.internal:8080/api/ws/;

        # Required for the HTTP/1.1 Upgrade handshake — without these three
        # lines nginx answers 200/502 and the socket never opens.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The socket stays open for a whole shift; the 60s default would kill it
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
    location /pur/ws/ {
        proxy_pass http://host.docker.internal:8060/api/ws/;

        # Required for the HTTP/1.1 Upgrade handshake — without these three
        # lines nginx answers 200/502 and the socket never opens.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The socket stays open for a whole shift; the 60s default would kill it
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
    # ─── K-Pulse (voter sentiment) — React SPA mounted on a sub-path ──────────
    # The build is served from /kpulse/ rather than a domain of its own, so the
    # app is built with Vite base="/kpulse/" and router basename="/kpulse".
    # Longest-prefix wins in nginx, so /kpulse/api/ is matched before /kpulse/
    # and before the root location — order in this file does not matter.

    # Its own Spring Boot instance: 8080 is distr, 8060 is pur, 9080 is cricket.
    location /kpulse/api/ {
        proxy_pass http://host.docker.internal:8090/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Report exports (PDF/Excel) stream out of POI/OpenPDF and can outrun
        # the 60s default on a whole-campaign, district-level report.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Hashed filenames, so these can be cached hard and forever.
    location /kpulse/assets/ {
        alias /var/www/kpulse/build/dist/assets/;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The entry document must never be cached, or a redeploy keeps serving the
    # old bundle's asset hashes and the app dies on a 404 chunk.
    location = /kpulse/index.html {
        alias /var/www/kpulse/build/dist/index.html;
        add_header Cache-Control "no-store";
    }

    # Without this, "direco.co.in/kpulse" (no trailing slash) misses the prefix
    # location below and falls through to the distr SPA.
    location = /kpulse {
        return 301 /kpulse/;
    }

    location /kpulse/ {
        alias /var/www/kpulse/build/dist/;
        # Client-side routing: /kpulse/admin/requests is not a file on disk.
        try_files $uri $uri/ /kpulse/index.html;
    }
    # ─── end K-Pulse ─────────────────────────────────────────────────────────

    location / {
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;
    gzip_min_length 256;
}
