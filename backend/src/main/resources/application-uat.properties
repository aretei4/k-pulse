# dev - a developer machine. Zero setup: in-memory H2 in PostgreSQL mode, the
# same Flyway migration, and the Bhadrak demo dataset loaded on every start.
#
#   mvn spring-boot:run          (dev is the default profile)
#
# To run dev against a local PostgreSQL instead, set KPULSE_DB_URL,
# KPULSE_DB_USER and KPULSE_DB_PASSWORD. The JDBC driver follows the URL.
spring.datasource.url=jdbc:postgresql://52.66.119.34:5432/kpulse?currentSchema=uat
spring.datasource.username=postgres
spring.datasource.password=Sachi@2010

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# A published development value. uat and prod have no default at all.
kpulse.jwt.secret=${KPULSE_JWT_SECRET:k-pulse-development-secret-change-me-please-32b}

# No SMS gateway: the OTP comes back in the response so you can sign in.
kpulse.otp.expose-in-response=true

kpulse.seed.enabled=false
# Admin login. Created on start if missing, and its password is reset to this
# value whenever they differ: change it here and restart to change the login.
# At least 8 characters.
kpulse.admin.email=${KPULSE_ADMIN_EMAIL:admin@k-pulse.in}
kpulse.admin.password=${KPULSE_ADMIN_PASSWORD:Admin@123}

kpulse.cors.allowed-origins=http://localhost:5173,http://localhost:4173
