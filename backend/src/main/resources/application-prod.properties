# prod - direco.co.in/kpulse. Real PostgreSQL and real voter PII.
#
#   run-app.sh  ->  port: 8090 (the port nginx proxies /kpulse/api/ to)
#               ->  profile: prod
#
# This file holds no secrets. Supply them as environment variables, or in an
# untracked file on the server that is imported below:
#
#   /home/ubuntu/app/kpulse-prod.properties     (override: KPULSE_SECRETS_FILE)
#
# Keys are listed in backend/config/kpulse-secrets.properties.example.
# Precedence: environment variable, then the secrets file, then this file.
spring.config.import=optional:file:${KPULSE_SECRETS_FILE:/home/ubuntu/app/kpulse-prod.properties}

spring.datasource.url=${KPULSE_DB_URL:jdbc:postgresql://localhost:5432/kpulse}
spring.datasource.username=${KPULSE_DB_USER:kpulse}
spring.datasource.password=${KPULSE_DB_PASSWORD}

# Required, no default: prod refuses to start without a real secret.
kpulse.jwt.secret=${KPULSE_JWT_SECRET}

# Admin login. Created on start if missing, and its password is reset to this
# value whenever they differ: change it here and restart to change the login.
# At least 8 characters.
# Put the real values in the secrets file, not here. Blank leaves admins untouched.
kpulse.admin.email=${KPULSE_ADMIN_EMAIL:}
kpulse.admin.password=${KPULSE_ADMIN_PASSWORD:}

# Off. An exposed OTP lets anyone sign in as any agent. Agents cannot receive a
# code in prod until an SMS gateway is wired up - see Still open in the README.
kpulse.otp.expose-in-response=${KPULSE_OTP_EXPOSE:false}

# Off. The demo dataset is fake voters and must never reach production.
kpulse.seed.enabled=${KPULSE_SEED:false}

kpulse.cors.allowed-origins=${KPULSE_CORS_ORIGINS:https://direco.co.in}

spring.h2.console.enabled=false

# Business errors still carry their message (GlobalExceptionHandler sets it);
# this only stops framework error pages echoing internal detail.
server.error.include-message=never
