# Settings shared by every environment. Anything that differs between dev, uat
# and prod lives in application-<profile>.properties instead, so no environment
# can silently inherit another one's database, secret or safety switch.
#
# Choose the profile with --spring.profiles.active (run-app.sh does this) or
# SPRING_PROFILES_ACTIVE. With neither, the app starts as dev: in-memory, local,
# and unable to touch a real database by accident.
spring.application.name=k-pulse-api
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

spring.jackson.default-property-inclusion=always

# run-app.sh passes --server.port, which overrides this.
server.port=${SERVER_PORT:8080}

# nginx terminates HTTPS and proxies over plain http with X-Forwarded-Proto.
# Trusting that header lets Spring see the real https origin; without it a
# same-origin POST from https://direco.co.in looks cross-origin and is
# rejected with 403 "Invalid CORS request". Tomcat only accepts the header from
# private-network proxies (the nginx container), not from the internet.
server.forward-headers-strategy=native
server.error.include-message=always

kpulse.jwt.expiry-hours=${KPULSE_JWT_EXPIRY_HOURS:12}
kpulse.access.default-expiry-months=6
kpulse.otp.ttl-minutes=10

logging.level.com.kahga.pluse=INFO
