# test - used only through @ActiveProfiles("test"). Kept apart from the deploy
# profiles so that no change to dev, uat or prod can ever point the test suite
# at a real database.
spring.datasource.url=jdbc:h2:mem:kpulse-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

kpulse.jwt.secret=k-pulse-test-secret-at-least-thirty-two-bytes-long
kpulse.otp.expose-in-response=true
kpulse.seed.enabled=true
kpulse.admin.email=admin@k-pulse.in
kpulse.admin.password=test-admin-password
